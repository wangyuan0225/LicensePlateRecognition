server:
  port: 8088

spring:
  datasource:
    url: jdbc:mysql://192.168.232.145:3333/lpr_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Application custom config
app:
  jwt:
    secret: LprVisionSecretKey2026ForJwtTokenGenerationAndValidation
    expiration: 86400000  # 24 hours in ms
  upload:
    dir: upload/images
  result:
    dir: upload/results
  algorithms:
    yolo26:
      base-dir: ../algorithm/yolo26
      python-path: ../algorithm/yolo26/.venv/Scripts/python.exe
      script-name: detect_rec_plate.py
    yolov8:
      base-dir: ../algorithm/yolov8
      python-path: ../algorithm/yolov8/.venv/Scripts/python.exe
      script-name: detect_rec_plate.py
